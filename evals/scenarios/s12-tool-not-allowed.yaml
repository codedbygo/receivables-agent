id: s12-tool-not-allowed
title: Model requests a tool outside its role; refused and counted
input:
  trigger: manual
  customer: Metro Wholesale
  replay: fixture requests send_message
expected:
  class: null
  tools:
  - get_customer_history
  - send_message
  - draft_message
  outcome: WAIT_FOR_APPROVAL
script:  # the model's turns, served by a scripted transport; $customer is the customer's id
- {tool: get_customer_history, args: {customer_id: $customer}}
- {tool: send_message, args: {message_id: $customer}}
- tool: draft_message
  args:
    customer_id: $customer
    kind: reminder
    tone: $tone
    prose: "Dear Metro Wholesale,\n\nThis invoice is past due:\n\n{{invoice_table}}\n\nTotal outstanding: {{total}}\n\nCould you confirm a payment date this week?\n\nRegards,\nAccounts team"
- {final: done}
