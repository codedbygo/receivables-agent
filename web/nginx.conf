# The console: static build plus the API on the same origin (no CORS, no cross-site cookies).
# Any Host that is not ours is dropped (DNS rebinding).
server {
  listen 80 default_server;
  return 444;
}

server {
  listen 80;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 90s;  # a synchronous "Run agent now" makes up to 5 model turns
  }

  location / {
    try_files $uri /index.html;
  }
}
