openapi: 3.1.0
info:
  title: Collections Agent API
  version: 1.0.0
  description: REST API for the AI Receivables Collections Agent console, the bank webhook and admin controls. Serves the
    stories named in each operation's x-story-ids. Money fields are integer paise named *_paise (INR only); every amount shown
    to a user is formatted from these at the edge.
  contact:
    name: HACK-001 team
x-api-style: 'REST over HTTP with JSON bodies; one service; deviations from docs/api style: money fields are *_paise with
  no currency field (INR only, ADR-0003 and tenet 2); error codes are UPPER_SNAKE to match the MCP tool envelope (eng review
  Q2); authentication is a demo role header (engineer''s decision 2026-09-30, superseding the cookie sessions of ADR-0009
  for the localhost demo).'
x-versioning: Major in the path (/api/v1); X-API-Version reserved for dated changes.
x-authentication: 'X-Demo-Role: admin | collector | viewer on every operation except those marked security: [] (health, payment
  link) and the bank webhook (HMAC). The stack binds to localhost only. A missing or unknown role is 401; a role without the
  right is 403.'
servers:
- url: http://localhost:8000/api/v1
  description: local Docker Compose
security:
- demoRole: []
tags:
- name: health
  description: health
- name: auth
  description: auth
- name: dashboard
  description: dashboard
- name: customers
  description: customers
- name: runs
  description: runs
- name: messages
  description: messages
- name: replies
  description: replies
- name: promises
  description: promises
- name: disputes
  description: disputes
- name: escalations
  description: escalations
- name: payments
  description: payments
- name: webhooks
  description: webhooks
- name: admin
  description: admin
- name: evals
  description: evals
- name: cron
  description: cron
- name: pay
  description: pay
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      tags:
      - health
      x-story-ids:
      - US-01-014
      x-roles: public
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      security: []
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness with per-dependency checks
      tags:
      - health
      x-story-ids:
      - US-01-014
