components:
  securitySchemes:
    demoRole:
      type: apiKey
      in: header
      name: X-Demo-Role
      description: admin, collector or viewer
    bankSignature:
      type: apiKey
      in: header
      name: X-Bank-Signature
      description: hex HMAC-SHA256 of '<X-Bank-Timestamp>.<raw body>' with BANK_WEBHOOK_SECRET
  parameters:
    ApiVersion:
      name: X-API-Version
      in: header
      required: false
      schema:
        type: string
        example: '2026-09-30'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The message version the client saw; a different version returns 409 STALE_DRAFT
      schema:
        type: string
    BankTimestamp:
      name: X-Bank-Timestamp
      in: header
      required: true
      description: Unix seconds; rejected outside 300 s of server time
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  headers:
    XRequestId:
      schema:
        type: string
      description: Matches error.request_id and the server log line
  responses:
    BadRequest:
      description: Malformed request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BAD_REQUEST
              message: Malformed request
              request_id: req_01J9Z6
    Unauthorized:
      description: Not signed in
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Not signed in
              request_id: req_01J9Z6
    Forbidden:
      description: Signed in but not allowed
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Signed in but not allowed
              request_id: req_01J9Z6
    NotFound:
      description: Not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Not found
              request_id: req_01J9Z6
    Conflict:
      description: State or idempotency conflict
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: STALE_DRAFT
              message: State or idempotency conflict
              request_id: req_01J9Z6
    UnprocessableEntity:
      description: Valid shape, invalid content
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: AMOUNT_MISMATCH
              message: Valid shape, invalid content
              request_id: req_01J9Z6
    TooManyRequests:
      description: Rate limited
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limited
              request_id: req_01J9Z6
    InternalError:
      description: Unexpected error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL
              message: Unexpected error
              request_id: req_01J9Z6
    Unavailable:
      description: A dependency is not ready
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAVAILABLE
              message: A dependency is not ready
              request_id: req_01J9Z6
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable UPPER_SNAKE code, e.g. AMOUNT_MISMATCH, NOT_APPROVED, STALE_DRAFT
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
                required:
                - field
                - reason
            request_id:
              type: string
          required:
          - code
          - message
          - request_id
      required:
      - error
      example:
        error:
          code: AMOUNT_MISMATCH
          message: ₹4,50,000 is not the ledger amount for INV-1021
          details:
          - field: body
            reason: INV-1021 is 40000000 paise
          request_id: req_01J9Z6
    Page:
      type: object
      properties:
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      required:
      - next_cursor
      - has_more
      example:
        next_cursor: eyJpZCI6IjAxOTIifQ
        has_more: false
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum:
          - admin
          - collector
          - viewer
      required:
      - id
      - email
      - display_name
      - role
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        email: collector@example.in
        display_name: Priya (Collector)
        role: collector
    SignIn:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          format: password
      required:
      - email
      - password
      example:
        email: collector@example.in
        password: demo-password
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        segment:
          type: string
          enum:
          - enterprise
          - mid_market
          - sme
        credit_terms_days:
          type: integer
        outstanding_paise:
          type: integer
          format: int64
          minimum: 0
          description: Total outstanding (integer paise, INR)
        overdue_paise:
          type: integer
          format: int64
          minimum: 0
          description: Total overdue (integer paise, INR)
        band:
          anyOf:
          - type: string
            enum:
            - HIGH
            - MEDIUM
            - LOW
          - type: 'null'
        last_contact_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        next_action:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - name
      - email
      - phone
      - segment
      - credit_terms_days
      - outstanding_paise
      - overdue_paise
      - band
      - last_contact_at
      - next_action
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        name: ABC Distributors
        email: accounts@abc-distributors.example.in
        phone: +91-9800000001
        segment: mid_market
        credit_terms_days: 30
        outstanding_paise: 75000000
        overdue_paise: 75000000
        band: HIGH
        last_contact_at: null
        next_action: Send follow-up on missed promise
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          pattern: ^INV-[0-9]+$
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        amount_paise:
          type: integer
          format: int64
          minimum: 0
          description: Invoice amount (integer paise, INR)
        paid_paise:
          type: integer
          format: int64
          minimum: 0
          description: Sum of allocations (integer paise, INR)
        remaining_paise:
          type: integer
          format: int64
          minimum: 0
          description: Amount minus paid (integer paise, INR)
        status:
          type: string
          enum:
          - unpaid
          - partially_paid
          - paid
          - disputed
        days_overdue:
          type: integer
          description: From the demo clock; 0 when not due
      required:
      - id
      - number
      - invoice_date
      - due_date
      - amount_paise
      - paid_paise
      - remaining_paise
      - status
      - days_overdue
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        number: INV-1021
        invoice_date: '2026-08-12'
        due_date: '2026-09-11'
        amount_paise: 40000000
        paid_paise: 0
        remaining_paise: 40000000
        status: unpaid
        days_overdue: 19
    Priority:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        band:
          type: string
          enum:
          - HIGH
          - MEDIUM
          - LOW
        reasons:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              text:
                type: string
            required:
            - code
            - text
      required:
      - customer_id
      - customer_name
      - score
      - band
      - reasons
      example:
        customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        customer_name: ABC Distributors
        score: 86
        band: HIGH
        reasons:
        - code: HIGH_OUTSTANDING
          text: High outstanding (₹7,50,000)
        - code: OLDEST_OVERDUE
          text: Oldest invoice 19 days overdue
        - code: MISSED_PROMISES
          text: 1 missed promise
    GuardrailCheck:
      type: object
      properties:
        check:
          type: string
        token:
          type: string
        expected:
          anyOf:
          - type: string
          - type: 'null'
        ok:
          type: boolean
        code:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - check
      - token
      - expected
      - ok
      - code
      example:
        check: amount
        token: ₹4,00,000
        expected: INV-1021 40000000
        ok: true
        code: null
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        agent_run_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        kind:
          type: string
          enum:
          - reminder
          - followup
          - statement
          - dispute_ack
        channel:
          type: string
          enum:
          - email
          - whatsapp
          - voice
        tone:
          type: string
          enum:
          - gentle
          - firm
          - final
        status:
          type: string
          enum:
          - draft
          - pending_approval
          - approved
          - rejected
          - sent
          - failed
        subject:
          type: string
        body:
          type: string
        version:
          type: integer
          minimum: 1
        verified:
          type: boolean
          description: True when the current version passed guardrails
        guardrail_report:
          type: array
          items:
            $ref: '#/components/schemas/GuardrailCheck'
        invoice_ids:
          type: array
          items:
            type: string
            format: uuid
        rejected_reason:
          anyOf:
          - type: string
          - type: 'null'
        sent_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        last_error:
          anyOf:
          - type: string
          - type: 'null'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - customer_id
      - agent_run_id
      - kind
      - channel
      - tone
      - status
      - subject
      - body
      - version
      - verified
      - guardrail_report
      - invoice_ids
      - rejected_reason
      - sent_at
      - last_error
      - created_at
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        agent_run_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        kind: reminder
        channel: email
        tone: firm
        status: pending_approval
        subject: Overdue invoices for ABC Distributors
        body: Dear ABC Distributors, ... INV-1021 | ₹4,00,000 | due 11 Sep 2026 ... Total ₹7,50,000
        version: 1
        verified: true
        guardrail_report: []
        invoice_ids:
        - 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        rejected_reason: null
        sent_at: null
        last_error: null
        created_at: '2026-09-30T03:31:00Z'
    MessageEdit:
      type: object
      properties:
        body:
          type: string
          minLength: 1
        subject:
          type: string
          minLength: 1
        channel:
          anyOf:
          - type: string
            enum:
            - email
            - whatsapp
          - type: 'null'
      required:
      - body
      - subject
      example:
        subject: Overdue invoices for ABC Distributors
        body: Dear ABC Distributors, ...
    Reject:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
      - reason
      example:
        reason: Tone too firm for a first reminder
    BatchApprove:
      type: object
      description: Each draft at the version the collector saw; a newer version refuses the whole batch (STALE_DRAFT).
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              version:
                type: integer
                minimum: 1
            required:
            - id
            - version
      required:
      - messages
      example:
        messages:
        - id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
          version: 1
    ReplyCreate:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 5000
      required:
      - message_id
      - body
      example:
        message_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        body: We can pay ₹3 lakh on October 5 and the remaining amount later.
    Reply:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        message_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        body:
          type: string
        classification:
          anyOf:
          - type: string
            enum:
            - PROMISE
            - PART_PAYMENT
            - DISPUTE
            - STATEMENT_REQUEST
            - PAYMENT_CONFIRMATION
            - NO_INTENT_UNCLEAR
            - OTHER_NOISE
          - type: 'null'
        amount_paise:
          anyOf:
          - type: integer
            format: int64
            minimum: 0
            description: Parsed in code (integer paise, INR)
          - type: 'null'
        stated_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        invoice_refs:
          type: array
          items:
            type: string
        confidence:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        recommended_action:
          anyOf:
          - type: string
          - type: 'null'
        needs_review:
          type: boolean
        agent_run_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
      required:
      - id
      - customer_id
      - message_id
      - body
      - classification
      - amount_paise
      - stated_date
      - invoice_refs
      - confidence
      - recommended_action
      - needs_review
      - agent_run_id
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        message_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        body: We can pay ₹3 lakh on October 5 and the remaining amount later.
        classification: PROMISE
        amount_paise: 30000000
        stated_date: '2026-10-05'
        invoice_refs: []
        confidence: 0.93
        recommended_action: log_promise
        needs_review: false
        agent_run_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
    Promise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        amount_paise:
          type: integer
          format: int64
          minimum: 0
          description: Promised (integer paise, INR)
        promised_date:
          type: string
          format: date
        status:
          type: string
          enum:
          - pending
          - fulfilled
          - partially_fulfilled
          - missed
        invoice_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - id
      - customer_id
      - customer_name
      - amount_paise
      - promised_date
      - status
      - invoice_ids
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        customer_name: ABC Distributors
        amount_paise: 30000000
        promised_date: '2026-10-05'
        status: pending
        invoice_ids:
        - 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
    PromiseCheck:
      type: object
      properties:
        promise:
          $ref: '#/components/schemas/Promise'
        matched_payment_ids:
          type: array
          items:
            type: string
            format: uuid
        message:
          type: string
      required:
      - promise
      - matched_payment_ids
      - message
      example:
        promise:
          id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
          customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
          customer_name: ABC Distributors
          amount_paise: 30000000
          promised_date: '2026-10-05'
          status: fulfilled
          invoice_ids:
          - 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        matched_payment_ids:
        - 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        message: Payment of ₹3,00,000 matched
    Dispute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        invoice_number:
          type: string
        reason:
          type: string
        status:
          type: string
          enum:
          - open
          - resolved
        resolution_note:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - customer_id
      - invoice_id
      - invoice_number
      - reason
      - status
      - resolution_note
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        invoice_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        invoice_number: INV-1047
        reason: quantity mismatch
        status: open
        resolution_note: null
    Resolve:
      type: object
      properties:
        note:
          type: string
          minLength: 1
      required:
      - note
      example:
        note: Credit note issued for 10 units
    Escalation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - dispute
          - low_confidence
          - injection_suspected
          - claim_not_found
          - payment_needs_verification
        reason:
          type: string
        status:
          type: string
          enum:
          - open
          - resolved
        created_at:
          type: string
          format: date-time
      required:
      - id
      - customer_id
      - kind
      - reason
      - status
      - created_at
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        kind: dispute
        reason: 'INV-1047 disputed: quantity mismatch'
        status: open
        created_at: '2026-10-05T06:10:00Z'
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        amount_paise:
          type: integer
          format: int64
          minimum: 0
          description: Received (integer paise, INR)
        received_on:
          type: string
          format: date
        reference:
          anyOf:
          - type: string
          - type: 'null'
        source:
          type: string
          enum:
          - bank_feed
          - payment_link
          - manual
        match_status:
          type: string
          enum:
          - matched
          - needs_verification
        allocations:
          type: array
          items:
            type: object
            properties:
              invoice_id:
                type: string
                format: uuid
              invoice_number:
                type: string
              amount_paise:
                type: integer
                format: int64
                minimum: 0
                description: Applied (integer paise, INR)
            required:
            - invoice_id
            - invoice_number
            - amount_paise
      required:
      - id
      - customer_id
      - amount_paise
      - received_on
      - reference
      - source
      - match_status
      - allocations
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        amount_paise: 30000000
        received_on: '2026-10-05'
        reference: UTR 4411
        source: bank_feed
        match_status: matched
        allocations:
        - invoice_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
          invoice_number: INV-1021
          amount_paise: 30000000
    PaymentMatch:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        invoice_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - customer_id
      example:
        customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        invoice_ids:
        - 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
    BankCredit:
      type: object
      properties:
        event_id:
          type: string
          minLength: 1
        amount_paise:
          type: integer
          format: int64
          minimum: 0
          description: Credited (integer paise, INR)
        reference:
          type: string
        payer_name:
          type: string
        occurred_at:
          type: string
          format: date-time
      required:
      - event_id
      - amount_paise
      - reference
      - payer_name
      - occurred_at
      example:
        event_id: evt_20261005_0001
        amount_paise: 30000000
        reference: ABC DISTRIBUTORS UTR 4411
        payer_name: ABC Distributors
        occurred_at: '2026-10-05T05:00:00Z'
    SimulatedCredit:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        amount_paise:
          type: integer
          format: int64
          minimum: 0
          description: Credited (integer paise, INR)
        reference:
          type: string
      required:
      - customer_id
      - amount_paise
      - reference
      example:
        customer_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        amount_paise: 30000000
        reference: UTR 4411
    TimelineEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        business_date:
          type: string
          format: date
        kind:
          type: string
        actor:
          type: string
          enum:
          - ai
          - human
          - system
          - customer
        actor_name:
          anyOf:
          - type: string
          - type: 'null'
        amount_paise:
          anyOf:
          - type: integer
            format: int64
            minimum: 0
            description: Amount on the event (integer paise, INR)
          - type: 'null'
        summary:
          type: string
        ref_type:
          anyOf:
          - type: string
          - type: 'null'
        ref_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
      required:
      - id
      - occurred_at
      - business_date
      - kind
      - actor
      - actor_name
      - amount_paise
      - summary
      - ref_type
      - ref_id
      example:
        id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
        occurred_at: '2026-10-05T05:00:02Z'
        business_date: '2026-10-05'
        kind: promise_fulfilled
        actor: system
        actor_name: null
        amount_paise: 30000000
        summary: Promise of ₹3,00,000 for 05 Oct 2026 fulfilled
        ref_type: promise
        ref_id: 0192b1c2-7f3a-7c4e-9a1b-2c3d4e5f6a7b
    AgentStep:
      type: object
      properties:
        seq:
          type: integer
          minimum: 1
          maximum: 4
        role:
