# The console: static build plus the API on the same origin (no CORS, no cross-site cookies).
# Any Host that is not ours is dropped (DNS rebinding). This file is an nginx image template: only
# ${PUBLIC_HOST} is an environment variable; every other $name is an nginx variable left as is.
# One client address gets 20 requests a second on the API (burst 40): a loop of approvals or webhook
# posts is slowed here, and the LLM budget is not the only brake.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80 default_server;
  return 444;
}

server {
  listen 80;
  server_name localhost 127.0.0.1 ${PUBLIC_HOST};  # filled in by the nginx image's template step
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 90s;  # a synchronous "Run agent now" makes up to 5 model turns
  }

  location / {
    try_files $uri /index.html;
  }
}
